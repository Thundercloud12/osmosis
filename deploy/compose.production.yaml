name: osmosis-production

services:
  game-server:
    image: ${GAME_SERVER_IMAGE:?GAME_SERVER_IMAGE required}
    init: true
    restart: unless-stopped
    stop_grace_period: 30s

    environment:
      NODE_ENV: production
      PORT: "2567"
      CLIENT_ORIGINS: ${CLIENT_ORIGINS:?Required}
      LIVEKIT_URL: ${LIVEKIT_URL:-}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
      RECONNECT_SECRET: ${RECONNECT_SECRET:?Required}
      METRICS_TOKEN: ${METRICS_TOKEN:?Required}
      ENABLE_QUICK_PLAY: ${ENABLE_QUICK_PLAY:-false}
      ENABLE_TEST_ROOM_MODES: "true"

    ports:
      - "127.0.0.1:2567:2567"

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:2567/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
