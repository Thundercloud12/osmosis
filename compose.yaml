services:
  server:
    build:
      context: .
      target: server
    init: true
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 2567
      CLIENT_ORIGINS: "${CLIENT_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}"
      LIVEKIT_URL: ${LIVEKIT_URL:-}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
      RECONNECT_SECRET: ${RECONNECT_SECRET:-}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      ENABLE_TEST_ROOM_MODES: ${ENABLE_TEST_ROOM_MODES:-false}
    ports:
      - "2567:2567"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:2567/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

  web:
    build:
      context: .
      target: web
      args:
        VITE_GAME_SERVER_URL: ${VITE_GAME_SERVER_URL:-http://localhost:2567}
    init: true
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "5173:5173"
