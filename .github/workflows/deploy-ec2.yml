name: CI and EC2 deployment

on:
  push:
    branches:
      - main
    paths:
      - "apps/server/**"
      - "packages/**"
      - "Dockerfile"
      - "deploy/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - ".github/workflows/deploy-ec2.yml"
  pull_request:
    branches:
      - main
    paths:
      - "apps/**"
      - "packages/**"
      - "Dockerfile"
      - "compose.yaml"
      - "deploy/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - ".github/workflows/deploy-ec2.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: osmosis-production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

      - name: Build workspace
        run: pnpm build

  deploy:
    needs: checks
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Configure AWS credentials through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: osmosis-github-deploy

      - name: Deploy exact commit through Systems Manager
        env:
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          deploy_command="sudo -u ubuntu bash -lc 'cd /opt/osmosis && git fetch origin main --prune && git checkout --force --detach ${DEPLOY_SHA} && sudo docker compose --env-file deploy/production.env -f deploy/compose.production.yaml up -d --build --wait --wait-timeout 120'"
          jq -n --arg command "$deploy_command" '{commands: [$command], executionTimeout: ["1800"]}' \
            > "$RUNNER_TEMP/ssm-parameters.json"

          command_id="$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Osmosis deploy ${DEPLOY_SHA}" \
            --parameters "file://$RUNNER_TEMP/ssm-parameters.json" \
            --query 'Command.CommandId' \
            --output text)"
          echo "Started deployment command $command_id"

          for attempt in $(seq 1 360); do
            status="$(aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query Status \
              --output text 2>/dev/null || true)"
            case "$status" in
              Success)
                aws ssm get-command-invocation \
                  --command-id "$command_id" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query StandardOutputContent \
                  --output text
                exit 0
                ;;
              Failed|TimedOut|DeliveryTimedOut|ExecutionTimedOut|Cancelled|Cancelling|Undeliverable|Terminated|InvalidPlatform|AccessDenied)
                aws ssm get-command-invocation \
                  --command-id "$command_id" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query StandardOutputContent \
                  --output text || true
                aws ssm get-command-invocation \
                  --command-id "$command_id" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query StandardErrorContent \
                  --output text || true
                exit 1
                ;;
            esac
            sleep 5
          done

          echo "Timed out while waiting for the EC2 deployment command."
          exit 1
