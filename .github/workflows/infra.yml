name: Terraform infrastructure

on:
  pull_request:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/infra.yml"
      - ".github/workflows/infra-apply.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: osmosis-terraform-production
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Terraform (no cloud credentials)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.11.4

      - name: Format, initialize without backend credentials, and validate
        run: |
          terraform -chdir=infra fmt -check -recursive
          terraform -chdir=infra init -backend=false -input=false -lockfile=readonly
          terraform -chdir=infra validate -no-color

  plan:
    name: Plan production infrastructure
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_VAR_subnet_id: ${{ vars.AWS_SUBNET_ID }}
      TF_VAR_game_domain: ${{ vars.GAME_DOMAIN }}
      TF_VAR_cloudflare_zone_id: ${{ vars.CLOUDFLARE_ZONE_ID }}
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.11.4

      - name: Assume read-only Terraform plan role through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_TF_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: osmosis-terraform-plan-${{ github.run_id }}

      - name: Generate and render the saved plan
        run: |
          set -euo pipefail
          terraform -chdir=infra init -input=false
          terraform -chdir=infra plan -input=false -no-color -out="$RUNNER_TEMP/tfplan" > "$RUNNER_TEMP/plan.log"
          terraform -chdir=infra show -no-color "$RUNNER_TEMP/tfplan" > "$RUNNER_TEMP/terraform-plan.txt"
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/plan.commit"
          plan_prefix="s3://osmosis-tfstate-sexy2223/production/plans/${GITHUB_RUN_ID}"
          aws s3 cp "$RUNNER_TEMP/tfplan" "$plan_prefix/tfplan" --only-show-errors
          aws s3 cp "$RUNNER_TEMP/terraform-plan.txt" "$plan_prefix/terraform-plan.txt" --only-show-errors
          aws s3 cp "$RUNNER_TEMP/plan.commit" "$plan_prefix/plan.commit" --only-show-errors

      - name: Summarize plan availability
        run: |
          {
            echo 'Terraform plan generated and stored under the private S3 plans prefix.'
            echo 'Review production/plans/'"$GITHUB_RUN_ID"'/terraform-plan.txt in the existing state bucket before applying.'
            echo 'A one-day S3 lifecycle rule must expire current and noncurrent plan objects.'
            echo "Plan run ID: $GITHUB_RUN_ID"
            echo "Commit: $GITHUB_SHA"
          } >> "$GITHUB_STEP_SUMMARY"
